spring:
  datasource:
    url: jdbc:mysql://${LOCAL_DB_ENDPOINT}/hotdeal_ecommerce_order
    username: ${LOCAL_DB_USERNAME}
    password: ${LOCAL_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  cache:
    type: ${SPRING_CACHE_TYPE:redis}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    show-sql: true
  kafka:
    bootstrap-servers: ${LOCAL_KAFKA_ENDPOINT}
    consumer:
      bootstrap-servers: ${LOCAL_KAFKA_ENDPOINT}  # 컨슈머에도 명시적으로 설정
    producer:
      bootstrap-servers: ${LOCAL_KAFKA_ENDPOINT}  # 프로듀서에도 명시적으로 설정
  data:
    redis:
      host: ${REDIS_LOCAL_HOST}
      port: ${REDIS_LOCAL_PORT}
      username: ${REDIS_LOCAL_USERNAME}
      password: ${REDIS_LOCAL_PASSWORD}


server:
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:200}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:19090/eureka/

# 성능 테스트 Stage 0~5 비교용 토글 (application.yml 참고: 기본값은 기존 운영 동작과 동일)
perf-test:
  parallel-fetch: ${PERF_PARALLEL_FETCH:true}
  sync-reduce-quantity: ${PERF_SYNC_REDUCE_QUANTITY:false}